version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - cd lambda_package
      - echo "Installing dependencies..."
      # zipコマンドをインストール
      - yum install -y zip
      # pipをアップグレード
      - pip install --upgrade pip
      # 必要なライブラリを package フォルダにインストール
      - pip install -r requirements.txt -t ./package
      
  build:
    commands:
      - echo "Creating deployment package..."
      # スクリプトを package フォルダにコピー
      - cp scraper.py ./package/
      # package フォルダの中身をzipにまとめる
      - cd package
      - zip -r ../deployment_package.zip .
      - cd ..

  post_build:
    commands:
      - echo "Deploying to Lambda..."
      - aws lambda update-function-code --function-name kobeNewsScraperFunction --zip-file fileb://deployment_package.zip
      - echo "Deployment complete."

artifacts:
  files:
    - lambda_package/deployment_package.zip